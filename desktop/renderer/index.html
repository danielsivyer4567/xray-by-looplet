<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>X-Ray by Looplet</title>
<style>
  /* Neutral charcoal theme (no navy) — matches the CAD Studio aesthetic.
     Swap this whole file for studio.html when the CAD Studio UI moves in;
     the only contract with the shell is window.xray.pickPdf / runTakeoff. */
  :root {
    --bg: #1e1e1e; --panel: #262626; --edge: #3a3a3a;
    --ink: #e8e6e1; --muted: #9a968e; --cream: #f2ede3;
    --accent: #c9a227; /* muted brass, not blue */
    --ok: #6f9f6a; --single: #b8a45f; --human: #c07a5b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif;
         background: var(--bg); color: var(--ink); height: 100vh; display: flex; flex-direction: column; }
  header { padding: 14px 20px; background: var(--panel); border-bottom: 1px solid var(--edge);
           display: flex; align-items: center; gap: 14px; }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 12px; }
  button { background: var(--accent); color: #201c10; border: 0; border-radius: 6px;
           padding: 9px 16px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: default; }
  main { flex: 1; overflow: auto; padding: 20px; }
  .status { color: var(--muted); margin: 4px 0 16px; min-height: 20px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--edge); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
  td.qty { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tier { font-size: 11px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .tier.reconciled { background: rgba(111,159,106,.18); color: var(--ok); }
  .tier.single-source { background: rgba(184,164,95,.18); color: var(--single); }
  .tier.needs-human { background: rgba(192,122,91,.20); color: var(--human); }
  .formula { color: var(--muted); font-size: 12px; }
  footer { padding: 8px 20px; background: var(--panel); border-top: 1px solid var(--edge);
           color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <h1>X-Ray <span style="color:var(--accent)">by Looplet</span></h1>
    <span class="sub">deterministic takeoff — an LLM never produces a quantity</span>
    <span style="flex:1"></span>
    <button id="open">Open Plan PDF</button>
  </header>
  <main>
    <div class="status" id="status">Open a plan PDF to run a takeoff. Fully offline.</div>
    <table id="tbl" hidden>
      <thead><tr><th>Trade</th><th>Item</th><th class="qty">Qty</th><th>Unit</th><th>Tier</th><th>Formula</th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </main>
  <footer id="foot">engine: not run yet</footer>

  <script src="./engine-client.js"></script>
  <script src="./app.js"></script>
</body>
</html>
