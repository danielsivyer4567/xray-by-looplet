<svg xmlns="http://www.w3.org/2000/svg" width="12000mm" height="8000mm" viewBox="0 0 12000 8000">
  <!-- a CAD-exported plan: named groups act as layers, rects are column footprints -->
  <g id="FOOTPRINT">
    <rect x="0" y="0" width="12000" height="8000" fill="none" stroke="#000" stroke-width="20"/>
  </g>
  <g id="PERIMETER_COLUMNS">
    <rect x="150" y="150" width="100" height="100"/>
    <rect x="11750" y="150" width="100" height="100"/>
    <rect x="150" y="7750" width="100" height="100"/>
    <rect x="11750" y="7750" width="100" height="100"/>
    <rect x="5950" y="150" width="100" height="100"/>
  </g>
  <text x="6000" y="4000" font-size="220">16000</text>
</svg>
